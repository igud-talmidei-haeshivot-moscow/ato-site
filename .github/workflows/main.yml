name: Sync Nigunim from Google Drive

on:
  workflow_dispatch: # Запуск вручную кнопкой Run workflow

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download MP3s from Google Drive links in Sheet
        env:
          SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAAuPFgjW2LESsVaPw7HYqytvR-3uGhouUlH-0jDbw6sz_UMrWhK2vWi5tBBh4Re17DeG-6mzIcQmT/pub?gid=1555876785&single=true&output=csv"
          AUDIO_DIR: "public/audio/nigunim"
        run: |
          python3 - << 'EOF'
          import csv, os, re, urllib.request

          url = os.environ["SHEET_CSV_URL"]
          out_dir = os.environ["AUDIO_DIR"]
          os.makedirs(out_dir, exist_ok=True)

          req = urllib.request.urlopen(url)
          lines = [line.decode("utf-8") for line in req.readlines()]
          reader = csv.DictReader(lines)

          for row in reader:
              file_val = (row.get("Файл") or "").strip()
              if not file_val:
                  continue

              # Если в колонке ссылка на Google Диск вида ...id=FILE_ID
              m = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', file_val) or re.search(r'/d/([a-zA-Z0-9_-]+)', file_val)
              if m:
                  file_id = m.group(1)
                  dest_path = os.path.join(out_dir, f"{file_id}.mp3")
                  if not os.path.exists(dest_path):
                      dl_url = f"https://drive.google.com/uc?export=download&confirm=t&id={file_id}"
                      print(f"Скачиваю {file_id}.mp3...")
                      urllib.request.urlretrieve(dl_url, dest_path)
          EOF

      - name: Commit and push audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/nigunim
          git diff --staged --quiet || git commit -m "Sync nigunim audio from Google Drive"
          git push
