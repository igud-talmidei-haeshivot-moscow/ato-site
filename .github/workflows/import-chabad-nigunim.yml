name: Import All Chabad.org Nigunim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-nigunim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install browser-impersonating HTTP client
        run: pip install curl_cffi

      - name: Scrape and download Chabad Melodies
        run: |
          python3 - << 'EOF'
          import csv, html, os, re, time, urllib.parse
          from curl_cffi import requests

          BASE_URL = "https://www.chabad.org"
          INDEX_URL = "https://www.chabad.org/multimedia/music_cdo/aid/140602/jewish/Chabad-Melodies.htm"

          session = requests.Session(impersonate="chrome")

          def fetch_text(url):
              resp = session.get(url, timeout=30)
              resp.raise_for_status()
              return resp.text

          os.makedirs("audio/chabad", exist_ok=True)
          index_html = fetch_text(INDEX_URL)

          # Находим ссылки на все тома (Volume 1 ... Volume 16)
          vol_matches = re.findall(
              r'href="(/multimedia/music_cdo/aid/\d+/jewish/Volume-(\d+)[^"]*)"',
              index_html,
              flags=re.IGNORECASE
          )

          volumes = {}
          for path, num in vol_matches:
              volumes[int(num)] = urllib.parse.urljoin(BASE_URL, path)

          print(f"Found {len(volumes)} volumes: {sorted(volumes.keys())}")

          rows = [["Название", "Категория", "Аудио", "Статья"]]
          seen_aids = set()

          for vol_num in sorted(volumes.keys()):
              vol_url = volumes[vol_num]
              print(f"Scanning Volume {vol_num}: {vol_url}")
              vol_html = fetch_text(vol_url)

              # Проверяем, есть ли ссылка "View All" для раскрытия всех треков тома
              view_all = re.search(
                  r'href="(/multimedia/music_cdo/aid/\d+/jewish/[^"]*)"[^>]*>\s*View\s+All',
                  vol_html,
                  flags=re.IGNORECASE
              )
              if view_all:
                  full_vol_url = urllib.parse.urljoin(BASE_URL, view_all.group(1))
                  print(f"  -> Following View All: {full_vol_url}")
                  vol_html = fetch_text(full_vol_url)

              track_links = re.findall(
                  r'href="(/multimedia/music_cdo/aid/(\d+)/jewish/[^"]+)"',
                  vol_html
              )

              for t_path, aid in track_links:
                  if aid in seen_aids or f"Volume-{vol_num}" in t_path:
                      continue
                  seen_aids.add(aid)

                  t_url = urllib.parse.urljoin(BASE_URL, t_path)
                  try:
                      t_html = fetch_text(t_url)
                  except Exception as e:
                      print(f"Skip {t_url}: {e}")
                      continue

                  mp3_match = re.search(r'(https?://[^"\'\s<>]+\.mp3(?:\?[^"\'\s<>]*)?)', t_html)
                  if not mp3_match:
                      continue

                  mp3_url = html.unescape(mp3_match.group(1))

                  h1_match = re.search(r'<h1[^>]*>(.*?)</h1>', t_html, flags=re.S)
                  if h1_match:
                      title = re.sub(r'<[^>]+>', '', h1_match.group(1)).strip()
                  else:
                      title = t_path.split("/")[-1].replace(".htm", "").replace("-", " ")
                  title = html.unescape(re.sub(r'\s+', ' ', title))

                  local_path = f"audio/chabad/vol{vol_num}_{aid}.mp3"
                  if not os.path.exists(local_path):
                      try:
                          mp3_resp = session.get(mp3_url, timeout=45)
                          mp3_resp.raise_for_status()
                          with open(local_path, "wb") as f_out:
                              f_out.write(mp3_resp.content)
                          print(f"Downloaded: {title} -> {local_path}")
                      except Exception as e:
                          print(f"Failed MP3 {mp3_url}: {e}")
                          continue

                  rows.append([title, f"Том {vol_num}", local_path, ""])
                  time.sleep(0.35)

          with open("nigunim_import.csv", "w", newline="", encoding="utf-8-sig") as f_csv:
              writer = csv.writer(f_csv)
              writer.writerows(rows)

          print(f"Done! Total tracks exported: {len(rows) - 1}")
          EOF

      - name: Commit imported audio and CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/chabad/ nigunim_import.csv
          if ! git diff --cached --quiet; then
            git commit -m "Bulk import Chabad.org nigunim archive"
            git push
          fi
